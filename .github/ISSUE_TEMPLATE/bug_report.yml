name: Bug report
description: Report incorrect routing, setup, discovery, or validation behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the orchestrator.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - Claude Code
        - Cursor
        - Antigravity
        - Gemini CLI
        - OpenCode
        - GitHub Copilot
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: UI/UX request
      description: Remove confidential product information.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Include inventory or setup output with secrets removed.
